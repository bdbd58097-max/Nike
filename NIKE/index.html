<!doctype html>
<html class="page" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nike Air-Mag</title>
    <link
      rel="shortcut icon"
      href="./icons/nike-favicon-48x48.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/index.css" />
    <script defer src="./js/index.js" type="module"></script>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <a class="header__logo logo" href="#">
          <img
            width="50"
            height="24"
            src="./icons/logo.svg"
            alt="Логотип Nike"
            class="logo__img"
          />
        </a>
        <nav id="header__menu" class="header__menu menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#Air Mag" class="menu__link">Air Mag</a>
            </li>
            <li class="menu__item">
              <a href="#Sizes" class="menu__link">Размеры</a>
            </li>
            <li class="menu__item">
              <a href="#Characteristics" class="menu__link">Характеристики</a>
            </li>
            <li class="menu__item">
              <a href="#Top-model" class="menu__link">Другие ТОП модели</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <a href="#" class="header__order">Сделать заказ</a>
          <div class="header__actions">
            <button aria-label="Поиск" class="header__actions-button">
              <svg width="24" height="24" class="header__actions-icon">
                <use href="./icons/sprite.svg#search"></use>
              </svg>
            </button>
            <button aria-label="Корзина" class="header__actions-button">
              <svg width="24" height="24" class="header__actions-icon">
                <use href="./icons/sprite.svg#cart"></use>
              </svg>
            </button>
            <button
              aria-label="Открыть меню"
              class="header__actions-button burger"
              aria-expanded="false"
              aria-controls="header__menu"
            >
              <svg width="24" height="24" class="header__actions-icon">
                <use
                  class="burger__icon-menu"
                  href="./icons/sprite.svg#burger-menu"
                ></use>
                <use
                  class="burger__icon-cross"
                  href="./icons/sprite.svg#burger-cross"
                ></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
